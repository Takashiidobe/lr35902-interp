[package]
name = "lr35902-interp"
version = "0.1.0"
edition = "2024"
description = "LR35902 assembly size and cycle estimator"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clap = { version = "4", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasm-bindgen = "0.2"
